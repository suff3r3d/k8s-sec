apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
spec:
  controller: k8s.io/ingress-nginx
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ingress-nginx
rules:
  - apiGroups: [""]
    resources: ["configmaps", "endpoints", "nodes", "pods", "secrets", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps", "pods", "secrets", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ingress-nginx
subjects:
  - kind: ServiceAccount
    name: ingress-nginx
    namespace: ingress-nginx
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ingress-nginx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ingress-nginx
subjects:
  - kind: ServiceAccount
    name: ingress-nginx
    namespace: ingress-nginx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress-nginx
    spec:
      serviceAccountName: ingress-nginx
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: controller
          image: registry.k8s.io/ingress-nginx/controller:v1.11.3
          args:
            - /nginx-ingress-controller
            - --election-id=ingress-nginx-leader
            - --controller-class=k8s.io/ingress-nginx
            - --ingress-class=nginx
            - --configmap=$(POD_NAMESPACE)/ingress-nginx-controller
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
---
apiVersion: v1
kind: Namespace
metadata:
  name: vulnerable-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app-1
  namespace: vulnerable-app
  labels:
    app: vulnerable-app-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-app-1
  template:
    metadata:
      labels:
        app: vulnerable-app-1
        falco.scope: vulnerable-app-1
    spec:
      containers:
        - name: vulnerable-app-1
          image: vulnerable-app-1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app-2
  namespace: vulnerable-app
  labels:
    app: vulnerable-app-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-app-2
  template:
    metadata:
      labels:
        app: vulnerable-app-2
        falco.scope: vulnerable-app-2
    spec:
      serviceAccountName: vulnerable-app-2-sa
      containers:
        - name: vulnerable-app-2
          image: vulnerable-app-2
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
# Service dành riêng cho App 1 (Chuyển sang ClusterIP để Ingress gọi nội bộ)
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-app-1-service
  namespace: vulnerable-app
spec:
  type: ClusterIP
  selector:
    app: vulnerable-app-1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
# Service dành riêng cho App 2
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-app-2-service
  namespace: vulnerable-app
spec:
  type: ClusterIP
  selector:
    app: vulnerable-app-2
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
---
# Bộ điều tuyến Ingress quản lý cả 2 ứng dụng
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vulnerable-apps-ingress
  namespace: vulnerable-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: vulnerable-1.lab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vulnerable-app-1-service
            port:
              number: 80
  - host: vulnerable-2.lab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vulnerable-app-2-service
            port:
              number: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vulnerable-app-2-sa
  namespace: vulnerable-app
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vulnerable-app-2-exec-role
  namespace: vulnerable-app
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vulnerable-app-2-exec-binding
  namespace: vulnerable-app
subjects:
  - kind: ServiceAccount
    name: vulnerable-app-2-sa
    namespace: vulnerable-app
roleRef:
  kind: Role
  name: vulnerable-app-2-exec-role
  apiGroup: rbac.authorization.k8s.io
