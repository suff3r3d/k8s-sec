apiVersion: v1
kind: Namespace
metadata:
  name: vulnerable-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app-1
  namespace: vulnerable-app
  labels:
    app: vulnerable-app-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-app-1
  template:
    metadata:
      labels:
        app: vulnerable-app-1
        falco.scope: vulnerable-app-1
    spec:
      containers:
        - name: vulnerable-app-1
          image: vulnerable-app-1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app-2
  namespace: vulnerable-app
  labels:
    app: vulnerable-app-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-app-2
  template:
    metadata:
      labels:
        app: vulnerable-app-2
        falco.scope: vulnerable-app-2
    spec:
      serviceAccountName: vulnerable-app-2-sa
      containers:
        - name: vulnerable-app-2
          image: vulnerable-app-2
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
# Service dành riêng cho App 1 (Chuyển sang ClusterIP để Ingress gọi nội bộ)
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-app-1-service
  namespace: vulnerable-app
spec:
  type: ClusterIP
  selector:
    app: vulnerable-app-1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
# Service dành riêng cho App 2
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-app-2-service
  namespace: vulnerable-app
spec:
  type: ClusterIP
  selector:
    app: vulnerable-app-2
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
---
# Bộ điều tuyến Ingress quản lý cả 2 ứng dụng
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vulnerable-apps-ingress
  namespace: vulnerable-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: vulnerable-1.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vulnerable-app-1-service
            port:
              number: 80
  - host: vulnerable-2.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vulnerable-app-2-service
            port:
              number: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vulnerable-app-2-sa
  namespace: vulnerable-app
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vulnerable-app-2-exec-role
  namespace: vulnerable-app
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vulnerable-app-2-exec-binding
  namespace: vulnerable-app
subjects:
  - kind: ServiceAccount
    name: vulnerable-app-2-sa
    namespace: vulnerable-app
roleRef:
  kind: Role
  name: vulnerable-app-2-exec-role
  apiGroup: rbac.authorization.k8s.io