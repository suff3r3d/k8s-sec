apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-nginx
  namespace: vulnerable-app
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - vulnerable-app-1
          - vulnerable-app-2

  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": ingress-nginx
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-egress-except-dns
  namespace: vulnerable-app
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - vulnerable-app-1
          - vulnerable-app-2

  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"