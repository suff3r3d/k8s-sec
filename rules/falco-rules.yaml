falco:
  rules_files:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/falco_rules.local.yaml
    - /etc/falco/rules.d

customRules:
  webroot-write-guard.yaml: |-
    - list: webroot_paths
      items: [/var/www/html]

    - macro: is_vulnerable_app_1
      condition: >
        k8s.ns.name = "vulnerable-app"
        and k8s.pod.name startswith "vulnerable-app-1"

    - macro: webroot_direct_write
      condition: >
        evt.type in (open, openat, openat2, creat)
        and evt.failed=false
        and evt.is_open_write=true
        and fd.name pmatch (webroot_paths)

    - macro: webroot_rename
      condition: >
        evt.type in (rename, renameat, renameat2)
        and evt.failed=false
        and fs.path.target startswith "/var/www/html"

    - macro: webroot_rename_dst
      condition: >
        evt.type in (rename, renameat, renameat2)
        and evt.failed=false
        and evt.abspath.dst startswith "/var/www/html"

    - rule : webroot_write_guard
      desc: Webroot write guard
      condition: >
        is_vulnerable_app_1 and webroot_direct_write
        or is_vulnerable_app_1 and webroot_rename
        or is_vulnerable_app_1 and webroot_rename_dst
      output: >
        Webroot got compromised
        file=%fd.name
        filename=%fd.filename
        path=%fs.path.name
        target=%fs.path.target
        dst=%evt.abspath.dst
        newpath=%evt.arg.newpath
        event=%evt.type
        user=%user.name
        process=%proc.name
        command=%proc.cmdline
        pod=%k8s.pod.name
        namespace=%k8s.ns.name
        container=%container.name
        # image=%container.image.repository:%container.image.tag
      priority: CRITICAL

  app-shell-spawn.yaml: |-
    - list: shell_binaries
      items: [sh, bash, dash, ash, zsh]

    - list: suspicious_shell_parents
      items: [apache2, httpd, php, php-fpm, python, python3, sudo]

    - macro: is_vulnerable_app_namespace
      condition: >
        k8s.ns.name = "vulnerable-app"

    - macro: shell_spawned_by_suspicious_parent
      condition: >
        evt.type = execve
        and proc.name in (shell_binaries)
        and proc.pname in (suspicious_shell_parents)

    - rule: webapp_shell_spawn
      desc: Detect shell spawned by a web runtime, app runtime, or privilege escalation helper
      condition: >
        is_vulnerable_app_namespace and shell_spawned_by_suspicious_parent
      output: >
        Shell spawned by suspicious parent process
        shell=%proc.name
        parent=%proc.pname
        command=%proc.cmdline
        parent_command=%proc.pcmdline
        user=%user.name
        pod=%k8s.pod.name
        namespace=%k8s.ns.name
        container=%container.name
        image=%container.image.repository:%container.image.tag
      priority: CRITICAL

  sudo-usage.yaml: |-
    - macro: is_vulnerable_app
      condition: >
        k8s.ns.name = "vulnerable-app"

    - macro: sudo_execution
      condition: >
        proc.name = sudo

    - rule: sudo_used_in_vulnerable_app
      desc: Detect sudo execution inside vulnerable app pods
      condition: >
        is_vulnerable_app and sudo_execution
      output: >
        Sudo executed inside vulnerable app
        command=%proc.cmdline
        parent=%proc.pname
        parent_command=%proc.pcmdline
        user=%user.name
        login_user=%user.loginname
        pod=%k8s.pod.name
        namespace=%k8s.ns.name
        container=%container.name
        image=%container.image.repository:%container.image.tag
      priority: CRITICAL
