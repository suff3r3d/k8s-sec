falco:
  rules_files:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/falco_rules.local.yaml
    - /etc/falco/rules.d

customRules:
  webroot-write-guard.yaml: |-
    - list: webroot_paths
      items: [/var/www/html]

    - macro: is_vulnerable_app_1
      condition: >
        k8s.ns.name = "vulnerable-app"
        and k8s.pod.name startswith "vulnerable-app-1"

    - macro: webroot_direct_write
      condition: >
        evt.type in (open, openat, openat2, creat)
        and evt.failed=false
        and evt.is_open_write=true
        and fd.name pmatch (webroot_paths)

    - macro: webroot_rename
      condition: >
        evt.type in (rename, renameat, renameat2)
        and evt.failed=false
        and fs.path.target startswith "/var/www/html"

    - macro: webroot_rename_dst
      condition: >
        evt.type in (rename, renameat, renameat2)
        and evt.failed=false
        and evt.abspath.dst startswith "/var/www/html"

    - rule : webroot_write_guard
      desc: Webroot write guard
      condition: >
        is_vulnerable_app_1 and webroot_direct_write
        or is_vulnerable_app_1 and webroot_rename
        or is_vulnerable_app_1 and webroot_rename_dst
      output: >
        Webroot got compromised
        file=%fd.name
        filename=%fd.filename
        path=%fs.path.name
        target=%fs.path.target
        dst=%evt.abspath.dst
        newpath=%evt.arg.newpath
        event=%evt.type
        user=%user.name
        process=%proc.name
        command=%proc.cmdline
        pod=%k8s.pod.name
        namespace=%k8s.ns.name
        container=%container.name
        # image=%container.image.repository:%container.image.tag
      priority: CRITICAL
